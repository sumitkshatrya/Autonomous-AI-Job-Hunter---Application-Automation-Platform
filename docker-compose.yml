version: '3.8'

services:
  # MongoDB Atlas / Community persistence
  mongodb:
    image: mongo:7.0
    container_name: autoapply-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: autoapply-ai

  # Express REST API Backend
  server:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.server
    container_name: autoapply-server
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/autoapply-ai
      JWT_SECRET: autoapply_super_production_secret_key_2026
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CORS_ORIGIN: http://localhost:3000

  # Dedicated Background Worker Engine (Persistent MongoDB Task Queue)
  workers:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.workers
    container_name: autoapply-workers
    restart: always
    depends_on:
      - mongodb
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/autoapply-ai
      WORKER_CONCURRENCY: 5
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

  # React SPA Frontend Client (Nginx)
  client:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.client
    container_name: autoapply-client
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  mongo_data:
